<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>My Profile | School Bus Track Pro</title>
  <link rel="icon" type="image/png" href="../assets/images/logo.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
  <style>
    html,body{height:100%;margin:0;}
    .admin-layout{display:flex;height:100vh;width:100vw;overflow:hidden;}
    .admin-main{flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden;}
    .admin-content{flex:1;overflow-y:auto;padding:24px;scrollbar-width:thin;}
    .profile-hero{background:var(--navy);border-radius:var(--r-xl);padding:32px;color:white;text-align:center;margin-bottom:20px;}
    .avatar-circle{width:90px;height:90px;border-radius:50%;background:var(--yellow);color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:800;margin:0 auto 16px;border:4px solid rgba(255,255,255,0.2);background-size:cover;background-position:center;overflow:hidden;}
    .profile-card{background:white;border:1px solid var(--border);border-radius:var(--r-xl);padding:24px;margin-bottom:16px;}
    .profile-card-title{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-muted);margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border);}
    .form-input{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--r-md);font-size:14px;color:var(--navy);background:var(--bg);outline:none;box-sizing:border-box;margin-bottom:14px;}
    .form-input:focus{border-color:var(--navy);background:white;}
    .form-label{font-size:12px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.3px;display:block;margin-bottom:4px;}
    .spin{animation:spin 1s linear infinite;}
    @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    @media(max-width:768px){
      html,body{overflow:auto!important;height:auto!important;}
      .admin-layout{height:auto!important;overflow:visible!important;}
      .admin-main{height:auto!important;overflow:visible!important;}
      .admin-content{overflow:visible!important;padding:16px 16px 100px!important;}
      .admin-sidebar{display:none!important;}
      .bottom-nav.mobile-only{height:64px!important;padding:0!important;display:flex!important;flex-direction:row!important;justify-content:space-around!important;align-items:center!important;background:var(--navy)!important;position:fixed!important;bottom:0!important;left:0!important;right:0!important;z-index:999!important;}
      .bottom-nav.mobile-only a{flex:1!important;height:100%!important;display:flex!important;flex-direction:column!important;justify-content:center!important;align-items:center!important;font-size:0!important;color:rgba(255,255,255,0.6)!important;text-decoration:none!important;}
      .bottom-nav.mobile-only a i{font-size:22px!important;color:rgba(255,255,255,0.6)!important;}
      .bottom-nav.mobile-only a.active i{color:var(--yellow)!important;}
    }
  </style>
</head>
<body>
<div class="admin-layout">
  <aside class="admin-sidebar" style="display:flex;flex-direction:column;height:100vh;">
    <div class="sidebar-logo"><img src="../assets/images/logo.png" alt="Logo"><div class="logo-text" id="sidebar-school-name">School Bus Track Pro <small>Attendant Hub</small></div></div>
    <nav class="sidebar-nav" style="flex:1;overflow-y:auto;">
      <div class="nav-group-label">Operations</div>
      <a href="dashboard.html" class="nav-link"><i class="bi bi-speedometer2"></i><span>Dashboard</span></a>
      <a href="students.html" class="nav-link"><i class="bi bi-people-fill"></i><span>Student Register</span></a>
      <a href="schedule.html" class="nav-link"><i class="bi bi-calendar-check-fill"></i><span>Route Manifest</span></a>
      <div class="nav-group-label">Account</div>
      <a href="profile.html" class="nav-link active"><i class="bi bi-person-gear"></i><span>My Profile</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="admin-user" style="display:flex;align-items:center;gap:12px;">
        <div id="sidebar-avatar" style="width:36px;height:36px;background:var(--yellow);color:var(--navy);border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;font-weight:800;">A</div>
        <div style="color:white;font-size:13px;"><div style="font-weight:800;" id="sidebar-name">Attendant</div><div style="opacity:0.6;font-size:11px;" id="sidebar-bus">Bus ---</div></div>
      </div>
      <button id="signout-btn" class="btn btn-red btn-full btn-sm" style="margin-top:16px;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);width:100%;"><i class="bi bi-power"></i> Log Out</button>
    </div>
  </aside>
  <main class="admin-main">
    <header class="admin-topbar"><h1 class="topbar-title">My Profile</h1></header>
    <div class="admin-content">
      <div class="profile-hero">
        <div class="avatar-circle" id="avatar-circle">?</div>
        <h2 id="display-name" style="font-weight:800;margin:0 0 4px;">---</h2>
        <div style="opacity:0.6;font-size:13px;" id="display-email">---</div>
        <div style="margin-top:8px;"><span class="badge badge-yellow" style="font-size:11px;">Bus Attendant</span></div>
      </div>
      <div class="profile-card">
        <div class="profile-card-title"><i class="bi bi-pencil-fill"></i> Personal Details</div>
        <label class="form-label">Full Name</label>
        <input type="text" id="input-name" class="form-input">
        <label class="form-label">Phone Number</label>
        <input type="tel" id="input-phone" class="form-input" placeholder="+234...">
        <button class="btn btn-yellow btn-full" id="btn-save" onclick="saveProfile()" style="font-weight:800;">
          <i class="bi bi-check-circle-fill"></i> Save Changes
        </button>
      </div>
      <div class="profile-card">
        <div class="profile-card-title"><i class="bi bi-shield-lock-fill"></i> Security</div>
        <button class="btn btn-ghost btn-full" onclick="sendReset()" style="font-weight:700;">
          <i class="bi bi-envelope-fill"></i> Send Password Reset Email
        </button>
      </div>
    </div>
  </main>
</div>
<nav class="bottom-nav mobile-only">
  <a href="dashboard.html"><i class="bi bi-speedometer2"></i></a>
  <a href="students.html"><i class="bi bi-people-fill"></i></a>
  <a href="schedule.html"><i class="bi bi-calendar-check-fill"></i></a>
  <a href="profile.html" class="active"><i class="bi bi-person-gear"></i></a>
</nav>
<div id="toast-container"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module">
  import { supabase, getUserProfile } from '../js/config.js';
  import { requireAuth, signOut } from '../js/auth.js';
  await requireAuth();
  const profile = await getUserProfile();
  if (!profile || profile.role !== 'bus_attendant') { await supabase.auth.signOut(); window.location.href = '../index.html'; throw new Error('Not authorized.'); }
  const ORG_ID = profile.organization_id, USER_ID = profile.id;
  const { data: org } = await supabase.from('organizations').select('name').eq('id', ORG_ID).single();
  if (org) document.getElementById('sidebar-school-name').innerHTML = `${org.name} <small>Attendant Hub</small>`;
  document.getElementById('signout-btn').onclick = () => signOut();
  const { data: { user } } = await supabase.auth.getUser();
  async function loadProfile() {
    const { data: p } = await supabase.from('profiles').select('*').eq('id', USER_ID).single();
    if (!p) return;
    const name = p.full_name || 'Attendant';
    document.getElementById('display-name').textContent   = name;
    document.getElementById('display-email').textContent  = user?.email || '';
    document.getElementById('sidebar-name').textContent   = name;
    document.getElementById('sidebar-avatar').textContent = name.charAt(0).toUpperCase();
    document.getElementById('avatar-circle').textContent  = name.charAt(0).toUpperCase();
    document.getElementById('input-name').value  = name;
    document.getElementById('input-phone').value = p.phone || '';
    const { data: bus } = await supabase.from('buses').select('id').eq('attendant_id', USER_ID).single();
    if (bus) document.getElementById('sidebar-bus').textContent = `Bus ${bus.id}`;
  }
  await loadProfile();
  window.saveProfile = async () => {
    const btn = document.getElementById('btn-save');
    btn.disabled = true; btn.innerHTML = '<i class="bi bi-arrow-clockwise spin"></i> Saving...';
    const { error } = await supabase.from('profiles').update({
      full_name: document.getElementById('input-name').value.trim(),
      phone:     document.getElementById('input-phone').value.trim() || null,
    }).eq('id', USER_ID);
    btn.disabled = false; btn.innerHTML = '<i class="bi bi-check-circle-fill"></i> Save Changes';
    if (error) { showToast('Save failed: ' + error.message, 'error'); return; }
    showToast('Profile updated.', 'success'); loadProfile();
  };
  window.sendReset = async () => {
    const { error } = await supabase.auth.resetPasswordForEmail(user.email, { redirectTo: window.location.origin + '/reset-password.html' });
    if (!error) showToast('Reset email sent to ' + user.email, 'success');
    else showToast('Failed: ' + error.message, 'error');
  };
  function showToast(m, t='info') { const c = document.getElementById('toast-container'); const d = document.createElement('div'); d.className = `toast ${t} active`; d.textContent = m; c.appendChild(d); setTimeout(()=>d.remove(),4000); }
</script>
</body>
</html>
