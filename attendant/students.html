<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Student Register | School Bus Track Pro</title>
  <link rel="icon" type="image/png" href="../assets/images/logo.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
  <style>
    html, body { height: 100%; margin: 0; }
    .admin-layout { display: flex; height: 100vh; width: 100vw; overflow: hidden; }
    .admin-main { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    .admin-content { flex: 1; overflow-y: auto; padding: 24px; scrollbar-width: thin; }

    .student-card { background: white; border: 1.5px solid var(--border); border-radius: var(--r-xl); padding: 16px 20px; display: flex; align-items: center; gap: 16px; transition: 0.2s; margin-bottom: 10px; }
    .student-card.boarded { border-color: var(--green); background: #f0fdf4; }
    .student-card.alighted { border-color: #e2e8f0; background: #f8fafc; opacity: 0.7; }
    .student-av { width: 46px; height: 46px; border-radius: 50%; background: var(--yellow); color: var(--navy); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px; flex-shrink: 0; }
    .student-av.boarded { background: var(--green); color: white; }
    .student-name { font-weight: 800; font-size: 15px; color: var(--navy); }
    .student-meta { font-size: 12px; color: var(--text-secondary); font-weight: 600; margin-top: 2px; }
    .student-status { font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 20px; }
    .student-status.pending  { background: #fffbeb; color: #92400e; border: 1px solid #fde68a; }
    .student-status.boarded  { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
    .student-status.alighted { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }

    .action-btns { display: flex; gap: 8px; margin-left: auto; flex-shrink: 0; }

    .kpi-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 20px; }
    .kpi-mini { background: white; border: 1px solid var(--border); border-radius: var(--r-lg); padding: 14px; text-align: center; }
    .kpi-mini-label { font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; }
    .kpi-mini-value { font-size: 26px; font-weight: 900; color: var(--navy); }

    .filter-row { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .search-input { flex: 1; min-width: 180px; padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--r-md); background: white; outline: none; font-size: 13px; }
    .status-select { padding: 0 14px; border: 1px solid var(--border); border-radius: var(--r-md); background: white; outline: none; font-size: 13px; color: var(--navy); height: 40px; }

    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    @media (max-width: 768px) {
      html, body { overflow: auto !important; height: auto !important; }
      .admin-layout { height: auto !important; overflow: visible !important; }
      .admin-main { height: auto !important; overflow: visible !important; }
      .admin-content { overflow: visible !important; padding: 16px 16px 100px !important; }
      .admin-sidebar { display: none !important; }
      .admin-topbar { flex-direction: column !important; align-items: stretch !important; gap: 10px !important; height: auto !important; padding: 16px !important; }
      .kpi-row { grid-template-columns: repeat(3, 1fr) !important; gap: 8px !important; }
      .student-card { flex-wrap: wrap; }
      .action-btns { width: 100%; margin-left: 0; }
      .action-btns button { flex: 1; }
      .bottom-nav.mobile-only { height: 64px !important; padding: 0 !important; display: flex !important; flex-direction: row !important; justify-content: space-around !important; align-items: center !important; background: var(--navy) !important; position: fixed !important; bottom: 0 !important; left: 0 !important; right: 0 !important; z-index: 999 !important; }
      .bottom-nav.mobile-only a { flex: 1 !important; height: 100% !important; display: flex !important; flex-direction: column !important; justify-content: center !important; align-items: center !important; font-size: 0 !important; color: rgba(255,255,255,0.6) !important; text-decoration: none !important; }
      .bottom-nav.mobile-only a i { font-size: 22px !important; color: rgba(255,255,255,0.6) !important; }
      .bottom-nav.mobile-only a.active i { color: var(--yellow) !important; }
    }
  </style>
</head>
<body>

<div class="admin-layout">
  <aside class="admin-sidebar" style="display:flex;flex-direction:column;height:100vh;">
    <div class="sidebar-logo">
      <img src="../assets/images/logo.png" alt="Logo">
      <div class="logo-text" id="sidebar-school-name">School Bus Track Pro <small>Attendant Hub</small></div>
    </div>
    <nav class="sidebar-nav" style="flex:1;overflow-y:auto;">
      <div class="nav-group-label">Operations</div>
      <a href="dashboard.html" class="nav-link"><i class="bi bi-speedometer2"></i><span>Dashboard</span></a>
      <a href="students.html" class="nav-link active"><i class="bi bi-people-fill"></i><span>Student Register</span></a>
      <a href="schedule.html" class="nav-link"><i class="bi bi-calendar-check-fill"></i><span>Route Manifest</span></a>
      <div class="nav-group-label">Account</div>
      <a href="profile.html" class="nav-link"><i class="bi bi-person-gear"></i><span>My Profile</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="admin-user" style="display:flex;align-items:center;gap:12px;">
        <div id="sidebar-avatar" style="width:36px;height:36px;background:var(--yellow);color:var(--navy);border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;font-weight:800;">A</div>
        <div style="color:white;font-size:13px;">
          <div style="font-weight:800;" id="sidebar-name">Attendant</div>
          <div style="opacity:0.6;font-size:11px;" id="sidebar-bus">Bus ---</div>
        </div>
      </div>
      <button id="signout-btn" class="btn btn-red btn-full btn-sm" style="margin-top:16px;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);width:100%;">
        <i class="bi bi-power"></i> Log Out
      </button>
    </div>
  </aside>

  <main class="admin-main">
    <header class="admin-topbar">
      <div>
        <h1 class="topbar-title">Student Register</h1>
        <p style="font-size:13px;color:var(--text-secondary);" id="topbar-meta">Checking students in and out</p>
      </div>
      <button class="btn btn-yellow btn-sm" onclick="markAllBoarded()">
        <i class="bi bi-check-all"></i> Mark All Boarded
      </button>
    </header>

    <div class="admin-content">

      <div class="kpi-row">
        <div class="kpi-mini">
          <div class="kpi-mini-label">Expected</div>
          <div class="kpi-mini-value" id="kpi-total">0</div>
        </div>
        <div class="kpi-mini">
          <div class="kpi-mini-label" style="color:var(--green);">On Board</div>
          <div class="kpi-mini-value" style="color:var(--green);" id="kpi-boarded">0</div>
        </div>
        <div class="kpi-mini">
          <div class="kpi-mini-label" style="color:#f59e0b;">Pending</div>
          <div class="kpi-mini-value" style="color:#f59e0b;" id="kpi-pending">0</div>
        </div>
      </div>

      <div class="filter-row">
        <input type="text" id="search-bar" class="search-input" placeholder="Search student name or ID...">
        <select id="status-filter" class="status-select">
          <option value="ALL">All Students</option>
          <option value="pending">Pending</option>
          <option value="boarded">On Board</option>
          <option value="alighted">Alighted</option>
        </select>
      </div>

      <div id="students-list">
        <div style="text-align:center;padding:60px;color:var(--text-muted);">
          <i class="bi bi-arrow-clockwise spin" style="font-size:28px;display:block;margin-bottom:12px;color:var(--yellow);"></i>
          Loading students...
        </div>
      </div>

    </div>
  </main>
</div>

<nav class="bottom-nav mobile-only">
  <a href="dashboard.html"><i class="bi bi-speedometer2"></i></a>
  <a href="students.html" class="active"><i class="bi bi-people-fill"></i></a>
  <a href="schedule.html"><i class="bi bi-calendar-check-fill"></i></a>
  <a href="profile.html"><i class="bi bi-person-gear"></i></a>
</nav>

<div id="toast-container"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module">
  import { supabase, getUserProfile } from '../js/config.js';
  import { requireAuth, signOut } from '../js/auth.js';

  await requireAuth();
  const profile = await getUserProfile();
  if (!profile || profile.role !== 'bus_attendant') {
    await supabase.auth.signOut(); window.location.href = '../index.html'; throw new Error('Not authorized.');
  }

  const ORG_ID  = profile.organization_id;
  const USER_ID = profile.id;

  const { data: org } = await supabase.from('organizations').select('name').eq('id', ORG_ID).single();
  if (org) document.getElementById('sidebar-school-name').innerHTML = `${org.name} <small>Attendant Hub</small>`;
  document.getElementById('sidebar-name').textContent   = profile.full_name || 'Attendant';
  document.getElementById('sidebar-avatar').textContent = (profile.full_name || 'A').charAt(0).toUpperCase();
  document.getElementById('signout-btn').onclick = () => signOut();

  // Get assigned bus
  const { data: busData } = await supabase.from('buses').select('id, plate_number')
    .eq('attendant_id', USER_ID).eq('organization_id', ORG_ID).single();

  if (!busData) {
    document.getElementById('topbar-meta').textContent = 'No bus assigned.';
    document.getElementById('sidebar-bus').textContent = 'No bus assigned';
    document.getElementById('students-list').innerHTML = `
      <div style="text-align:center;padding:60px;background:white;border-radius:var(--r-xl);border:1px solid var(--border);">
        <i class="bi bi-bus-front" style="font-size:40px;color:var(--border);display:block;margin-bottom:12px;"></i>
        <div style="font-weight:800;color:var(--navy);">No Bus Assigned</div>
        <div style="font-size:13px;color:var(--text-muted);margin-top:6px;">Contact your manager to get a bus assigned.</div>
      </div>`;
    return;
  }

  const busId = busData.id;
  document.getElementById('sidebar-bus').textContent = `Bus ${busId}`;
  document.getElementById('topbar-meta').textContent = `Bus ${busId} · ${busData.plate_number || ''}`;

  let allStudents     = [];
  let boardedStudents = new Set();
  let alightedStudents = new Set();

  // Load today's attendance
  async function loadTodayLogs() {
    const today = new Date().toISOString().split('T')[0];
    const { data: logs } = await supabase.from('attendance_logs')
      .select('student_id, direction')
      .eq('bus_id', busId).eq('organization_id', ORG_ID)
      .gte('scanned_at', today + 'T00:00:00Z');

    boardedStudents  = new Set();
    alightedStudents = new Set();

    if (logs) {
      logs.forEach(l => {
        if (l.direction === 'boarding')  boardedStudents.add(l.student_id);
        if (l.direction === 'alighting') alightedStudents.add(l.student_id);
      });
    }
  }

  async function loadStudents() {
    const { data, error } = await supabase.from('students')
      .select('id, full_name, age, gender, student_reg_id, medical_info')
      .eq('bus_id', busId).eq('organization_id', ORG_ID)
      .order('full_name');

    if (error) { showToast('Failed to load students: ' + error.message, 'error'); return; }
    allStudents = data || [];
    await loadTodayLogs();
    renderStudents();
  }

  function getStudentStatus(id) {
    if (alightedStudents.has(id)) return 'alighted';
    if (boardedStudents.has(id))  return 'boarded';
    return 'pending';
  }

  function renderStudents() {
    const list   = document.getElementById('students-list');
    const term   = document.getElementById('search-bar').value.toLowerCase();
    const filter = document.getElementById('status-filter').value;

    const boarded = allStudents.filter(s => getStudentStatus(s.id) === 'boarded').length;
    const pending = allStudents.filter(s => getStudentStatus(s.id) === 'pending').length;

    document.getElementById('kpi-total').textContent   = allStudents.length;
    document.getElementById('kpi-boarded').textContent = boarded;
    document.getElementById('kpi-pending').textContent = pending;

    const filtered = allStudents.filter(s => {
      const matchSearch = s.full_name?.toLowerCase().includes(term) || s.student_reg_id?.toLowerCase().includes(term);
      const status      = getStudentStatus(s.id);
      const matchFilter = filter === 'ALL' || status === filter;
      return matchSearch && matchFilter;
    });

    if (!filtered.length) {
      list.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-muted);font-size:13px;">No students found.</div>';
      return;
    }

    list.innerHTML = filtered.map(s => {
      const status = getStudentStatus(s.id);
      const isBoarded  = status === 'boarded';
      const isAlighted = status === 'alighted';

      return `<div class="student-card ${status}" id="scard-${s.id}">
        <div class="student-av ${isBoarded ? 'boarded' : ''}">
          ${isBoarded ? '<i class="bi bi-check-lg"></i>' : s.full_name.charAt(0).toUpperCase()}
        </div>
        <div style="flex:1;min-width:0;">
          <div class="student-name">${s.full_name}</div>
          <div class="student-meta">
            ID: ${s.student_reg_id || '---'} · Age: ${s.age || '--'} · ${s.gender || '--'}
            ${s.medical_info ? `<span style="color:#dc2626;margin-left:6px;"><i class="bi bi-heart-pulse-fill"></i> ${s.medical_info}</span>` : ''}
          </div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;">
          <span class="student-status ${status}">${status === 'boarded' ? '✅ ON BOARD' : status === 'alighted' ? '🚪 ALIGHTED' : '⏳ PENDING'}</span>
          <div class="action-btns">
            ${!isBoarded && !isAlighted ? `
              <button class="btn btn-yellow btn-sm" onclick="markBoarded('${s.id}','${s.full_name.replace(/'/g,"\\'")}')">
                <i class="bi bi-box-arrow-in-right"></i> Board
              </button>` : ''}
            ${isBoarded ? `
              <button class="btn btn-ghost btn-sm text-red" onclick="markAlighted('${s.id}','${s.full_name.replace(/'/g,"\\'")}')">
                <i class="bi bi-box-arrow-right"></i> Alight
              </button>` : ''}
            ${isAlighted ? `
              <button class="btn btn-ghost btn-sm" onclick="markBoarded('${s.id}','${s.full_name.replace(/'/g,"\\'")}')">
                <i class="bi bi-arrow-counterclockwise"></i> Re-board
              </button>` : ''}
          </div>
        </div>
      </div>`;
    }).join('');
  }

  window.markBoarded = async (studentId, name) => {
    const { error } = await supabase.from('attendance_logs').insert([{
      student_id:      studentId,
      bus_id:          busId,
      organization_id: ORG_ID,
      direction:       'boarding',
      scanned_by:      USER_ID
    }]);
    if (error) { showToast('Failed: ' + error.message, 'error'); return; }
    boardedStudents.add(studentId);
    alightedStudents.delete(studentId);
    showToast(`${name} marked as boarded.`, 'success');
    renderStudents();
  };

  window.markAlighted = async (studentId, name) => {
    const { error } = await supabase.from('attendance_logs').insert([{
      student_id:      studentId,
      bus_id:          busId,
      organization_id: ORG_ID,
      direction:       'alighting',
      scanned_by:      USER_ID
    }]);
    if (error) { showToast('Failed: ' + error.message, 'error'); return; }
    alightedStudents.add(studentId);
    showToast(`${name} marked as alighted.`, 'success');
    renderStudents();
  };

  window.markAllBoarded = async () => {
    if (!confirm(`Mark all ${allStudents.length} students as boarded?`)) return;
    const pending = allStudents.filter(s => getStudentStatus(s.id) === 'pending');
    for (const s of pending) await window.markBoarded(s.id, s.full_name);
    showToast(`All ${pending.length} students marked as boarded.`, 'success');
  };

  document.getElementById('search-bar').oninput    = () => renderStudents();
  document.getElementById('status-filter').onchange = () => renderStudents();

  function showToast(m, t='info') {
    const c = document.getElementById('toast-container');
    const d = document.createElement('div'); d.className = `toast ${t} active`; d.textContent = m; c.appendChild(d);
    setTimeout(() => d.remove(), 4000);
  }

  loadStudents();
</script>
</body>
</html>
