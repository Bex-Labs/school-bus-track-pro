<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Route Manifest | School Bus Track Pro</title>
  <link rel="icon" type="image/png" href="../assets/images/logo.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
  <style>
    html, body { height: 100%; margin: 0; }
    .admin-layout { display: flex; height: 100vh; width: 100vw; overflow: hidden; }
    .admin-main { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    .admin-content { flex: 1; overflow-y: auto; padding: 24px; scrollbar-width: thin; }
    .route-hero { background: var(--navy); border-radius: var(--r-xl); padding: 24px; color: white; margin-bottom: 20px; }
    .stop-item { background: white; border: 2px solid var(--border); border-radius: var(--r-xl); padding: 18px 20px; margin-bottom: 12px; transition: 0.2s; position: relative; overflow: hidden; }
    .stop-item.stop-active { border-color: var(--yellow); box-shadow: 0 4px 20px rgba(253,184,19,0.2); }
    .stop-item.stop-active::before { content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--yellow); }
    .stop-item.stop-done { border-color: var(--green); background: #f0fdf4; }
    .stop-item.stop-done::before { content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--green); }
    .stop-item.stop-upcoming { opacity: 0.5; }
    .stop-number { width:32px; height:32px; border-radius:50%; background:var(--bg); border:2px solid var(--border); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; color:var(--navy); flex-shrink:0; }
    .stop-number.active { background:var(--yellow); border-color:var(--yellow); color:var(--navy); }
    .stop-number.done { background:var(--green); border-color:var(--green); color:white; }
    .kpi-row { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:20px; }
    .kpi-mini { background:white; border:1px solid var(--border); border-radius:var(--r-lg); padding:14px; text-align:center; }
    .kpi-mini-label { font-size:10px; font-weight:700; text-transform:uppercase; color:var(--text-muted); margin-bottom:6px; }
    .kpi-mini-value { font-size:22px; font-weight:900; color:var(--navy); }
    .spin { animation:spin 1s linear infinite; }
    @keyframes spin { from{transform:rotate(0deg)}to{transform:rotate(360deg)} }
    @media(max-width:768px){
      html,body{overflow:auto!important;height:auto!important;}
      .admin-layout{height:auto!important;overflow:visible!important;}
      .admin-main{height:auto!important;overflow:visible!important;}
      .admin-content{overflow:visible!important;padding:16px 16px 100px!important;}
      .admin-sidebar{display:none!important;}
      .admin-topbar{flex-direction:row!important;align-items:center!important;padding:14px 16px!important;height:auto!important;}
      .kpi-row{grid-template-columns:repeat(3,1fr)!important;}
      .bottom-nav.mobile-only{height:64px!important;padding:0!important;display:flex!important;flex-direction:row!important;justify-content:space-around!important;align-items:center!important;background:var(--navy)!important;position:fixed!important;bottom:0!important;left:0!important;right:0!important;z-index:999!important;}
      .bottom-nav.mobile-only a{flex:1!important;height:100%!important;display:flex!important;flex-direction:column!important;justify-content:center!important;align-items:center!important;font-size:0!important;color:rgba(255,255,255,0.6)!important;text-decoration:none!important;}
      .bottom-nav.mobile-only a i{font-size:22px!important;color:rgba(255,255,255,0.6)!important;}
      .bottom-nav.mobile-only a.active i{color:var(--yellow)!important;}
    }
  </style>
</head>
<body>
<div class="admin-layout">
  <aside class="admin-sidebar" style="display:flex;flex-direction:column;height:100vh;">
    <div class="sidebar-logo"><img src="../assets/images/logo.png" alt="Logo"><div class="logo-text" id="sidebar-school-name">School Bus Track Pro <small>Attendant Hub</small></div></div>
    <nav class="sidebar-nav" style="flex:1;overflow-y:auto;">
      <div class="nav-group-label">Operations</div>
      <a href="dashboard.html" class="nav-link"><i class="bi bi-speedometer2"></i><span>Dashboard</span></a>
      <a href="students.html" class="nav-link"><i class="bi bi-people-fill"></i><span>Student Register</span></a>
      <a href="schedule.html" class="nav-link active"><i class="bi bi-calendar-check-fill"></i><span>Route Manifest</span></a>
      <div class="nav-group-label">Account</div>
      <a href="profile.html" class="nav-link"><i class="bi bi-person-gear"></i><span>My Profile</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="admin-user" style="display:flex;align-items:center;gap:12px;">
        <div id="sidebar-avatar" style="width:36px;height:36px;background:var(--yellow);color:var(--navy);border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;font-weight:800;">A</div>
        <div style="color:white;font-size:13px;"><div style="font-weight:800;" id="sidebar-name">Attendant</div><div style="opacity:0.6;font-size:11px;" id="sidebar-bus">Bus ---</div></div>
      </div>
      <button id="signout-btn" class="btn btn-red btn-full btn-sm" style="margin-top:16px;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);width:100%;"><i class="bi bi-power"></i> Log Out</button>
    </div>
  </aside>
  <main class="admin-main">
    <header class="admin-topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <a href="dashboard.html" style="color:var(--navy);font-size:20px;"><i class="bi bi-arrow-left-circle"></i></a>
        <div>
          <h1 class="topbar-title" id="route-name">Route Manifest</h1>
          <p style="font-size:13px;color:var(--text-secondary);" id="route-meta">Loading...</p>
        </div>
      </div>
      <span class="badge badge-yellow" id="trip-status-badge" style="font-size:11px;font-weight:800;">STANDBY</span>
    </header>
    <div class="admin-content">
      <div class="kpi-row">
        <div class="kpi-mini"><div class="kpi-mini-label">Progress</div><div class="kpi-mini-value" id="kpi-progress">0/0</div></div>
        <div class="kpi-mini"><div class="kpi-mini-label">First Stop</div><div class="kpi-mini-value" id="kpi-start" style="font-size:16px;">--:--</div></div>
        <div class="kpi-mini"><div class="kpi-mini-label">Last Stop</div><div class="kpi-mini-value text-yellow" id="kpi-eta" style="font-size:16px;">--:--</div></div>
      </div>
      <div class="route-hero" id="route-hero" style="display:none;">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;">
          <div><div style="font-size:20px;font-weight:900;" id="hero-route-name">Route</div><div style="font-size:13px;opacity:0.6;" id="hero-bus-name">Bus ---</div></div>
          <div style="text-align:right;"><div style="font-size:11px;font-weight:800;opacity:0.6;text-transform:uppercase;margin-bottom:4px;">Completion</div><div style="font-size:28px;font-weight:900;" id="hero-pct">0%</div></div>
        </div>
        <div style="height:8px;background:rgba(255,255,255,0.15);border-radius:4px;overflow:hidden;margin-bottom:8px;"><div id="hero-progress" style="height:100%;background:var(--yellow);border-radius:4px;transition:width 0.6s;width:0%;"></div></div>
        <div style="display:flex;justify-content:space-between;font-size:11px;font-weight:700;opacity:0.7;"><span id="hero-completed">0 completed</span><span id="hero-remaining">0 remaining</span></div>
      </div>
      <div id="stop-list">
        <div style="text-align:center;padding:60px;color:var(--text-muted);">
          <i class="bi bi-arrow-clockwise spin" style="font-size:32px;display:block;margin-bottom:12px;color:var(--yellow);"></i>
          <div style="font-weight:700;">Loading route data...</div>
        </div>
      </div>
    </div>
  </main>
</div>
<nav class="bottom-nav mobile-only">
  <a href="dashboard.html"><i class="bi bi-speedometer2"></i></a>
  <a href="students.html"><i class="bi bi-people-fill"></i></a>
  <a href="schedule.html" class="active"><i class="bi bi-calendar-check-fill"></i></a>
  <a href="profile.html"><i class="bi bi-person-gear"></i></a>
</nav>
<div id="toast-container"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module">
  import { supabase, getUserProfile } from '../js/config.js';
  import { requireAuth, signOut } from '../js/auth.js';
  await requireAuth();
  const profile = await getUserProfile();
  if (!profile || profile.role !== 'bus_attendant') { await supabase.auth.signOut(); window.location.href = '../index.html'; throw new Error('Not authorized.'); }
  const ORG_ID = profile.organization_id, USER_ID = profile.id;
  const { data: org } = await supabase.from('organizations').select('name').eq('id', ORG_ID).single();
  if (org) document.getElementById('sidebar-school-name').innerHTML = `${org.name} <small>Attendant Hub</small>`;
  document.getElementById('sidebar-name').textContent = profile.full_name || 'Attendant';
  document.getElementById('sidebar-avatar').textContent = (profile.full_name||'A').charAt(0).toUpperCase();
  document.getElementById('signout-btn').onclick = () => signOut();
  const { data: busData } = await supabase.from('buses').select('id').eq('attendant_id', USER_ID).eq('organization_id', ORG_ID).single();
  const busId = busData?.id || null;
  if (busId) document.getElementById('sidebar-bus').textContent = `Bus ${busId}`;
  let routeStops = [], completedStops = JSON.parse(localStorage.getItem(`att_completed_${busId}`) || '[]');
  if (!busId) {
    document.getElementById('route-name').textContent = 'No Bus Assigned';
    document.getElementById('stop-list').innerHTML = '<div style="text-align:center;padding:40px;background:white;border-radius:var(--r-xl);border:1px solid var(--border);"><i class="bi bi-bus-front" style="font-size:40px;color:var(--border);display:block;margin-bottom:12px;"></i><div style="font-weight:800;color:var(--navy);">No Bus Assigned</div></div>';
  } else {
    const { data: routes } = await supabase.from('routes').select('id,name').eq('bus_id', busId).eq('organization_id', ORG_ID).limit(1);
    if (routes && routes.length > 0) {
      const route = routes[0];
      document.getElementById('route-name').textContent = route.name;
      document.getElementById('hero-route-name').textContent = route.name;
      document.getElementById('hero-bus-name').textContent = `Bus ${busId}`;
      document.getElementById('route-hero').style.display = 'block';
      const { data: stops } = await supabase.from('stops').select('*').eq('route_id', route.id).eq('organization_id', ORG_ID).order('order_index', { ascending: true });
      if (stops && stops.length > 0) {
        routeStops = stops;
        document.getElementById('route-meta').textContent = `${stops.length} stops`;
        document.getElementById('kpi-start').textContent = stops[0].arrival_time || '--:--';
        document.getElementById('kpi-eta').textContent = stops[stops.length-1].arrival_time || '--:--';
        renderStops();
      } else {
        document.getElementById('route-meta').textContent = 'No stops yet';
        document.getElementById('stop-list').innerHTML = '<div style="text-align:center;padding:40px;background:white;border-radius:var(--r-xl);border:1px solid var(--border);"><i class="bi bi-geo-alt" style="font-size:40px;color:var(--border);display:block;margin-bottom:12px;"></i><div style="font-weight:800;color:var(--navy);">No Stops Configured</div></div>';
      }
    } else {
      document.getElementById('route-name').textContent = `Bus ${busId}`;
      document.getElementById('route-meta').textContent = 'No route assigned';
      document.getElementById('stop-list').innerHTML = '<div style="text-align:center;padding:40px;background:white;border-radius:var(--r-xl);border:1px solid var(--border);"><i class="bi bi-map" style="font-size:40px;color:var(--border);display:block;margin-bottom:12px;"></i><div style="font-weight:800;color:var(--navy);">No Route Assigned</div></div>';
    }
  }
  function renderStops() {
    const list = document.getElementById('stop-list');
    const total = routeStops.length, done = completedStops.length, pct = total > 0 ? Math.round((done/total)*100) : 0;
    let nextFound = false;
    document.getElementById('kpi-progress').textContent = `${done}/${total}`;
    document.getElementById('hero-pct').textContent = `${pct}%`;
    document.getElementById('hero-progress').style.width = `${pct}%`;
    document.getElementById('hero-completed').textContent = `${done} completed`;
    document.getElementById('hero-remaining').textContent = `${total-done} remaining`;
    if (done === total && total > 0) { const b = document.getElementById('trip-status-badge'); b.textContent = 'COMPLETE ✓'; b.style.background = 'var(--green)'; b.style.color = 'white'; }
    list.innerHTML = routeStops.map((stop, i) => {
      const isDone = completedStops.includes(stop.id);
      let status = 'stop-upcoming';
      if (isDone) { status = 'stop-done'; } else if (!nextFound) { status = 'stop-active'; nextFound = true; if (document.getElementById('trip-status-badge').textContent === 'STANDBY') { document.getElementById('trip-status-badge').textContent = 'IN PROGRESS'; } }
      const numClass = isDone ? 'done' : (status === 'stop-active' ? 'active' : '');
      return `<div class="stop-item ${status}">
        <div style="display:flex;align-items:flex-start;gap:14px;">
          <div class="stop-number ${numClass}">${isDone ? '<i class="bi bi-check-lg"></i>' : (i+1)}</div>
          <div style="flex:1;">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
              <div style="font-size:15px;font-weight:800;color:var(--navy);">${i===routeStops.length-1?'🏫 ':''}${stop.name}</div>
              <span style="background:${status==='stop-active'?'var(--yellow)':'var(--navy)'};color:${status==='stop-active'?'var(--navy)':'white'};padding:3px 10px;border-radius:20px;font-size:11px;font-weight:800;">${stop.arrival_time||'--:--'}</span>
            </div>
            <div style="font-size:12px;color:var(--text-secondary);font-weight:600;margin-top:4px;">
              <i class="bi bi-people-fill"></i> ${stop.students||0} students
              ${isDone ? '<span style="color:var(--green);margin-left:10px;font-weight:800;"><i class="bi bi-check-circle-fill"></i> Completed</span>' : ''}
              ${status==='stop-active' ? '<span style="color:var(--yellow);margin-left:10px;font-weight:800;"><i class="bi bi-record-circle-fill"></i> Current stop</span>' : ''}
            </div>
            ${status==='stop-active' ? `<div style="display:flex;gap:10px;margin-top:12px;">
              <button class="btn btn-navy" style="flex:1;font-weight:800;" onclick="markArrived('${stop.id}','${stop.name.replace(/'/g,"\\'")}')"><i class="bi bi-geo-alt-fill"></i> Arrived</button>
              <button class="btn btn-yellow" style="flex:1;font-weight:800;" onclick="completeStop('${stop.id}')"><i class="bi bi-check-lg"></i> Done</button>
            </div>` : ''}
          </div>
        </div>
      </div>`;
    }).join('');
  }
  window.markArrived = (id, name) => { showToast(`📍 Arrived at ${name}`, 'success'); };
  window.completeStop = (id) => {
    if (!completedStops.includes(id)) { completedStops.push(id); localStorage.setItem(`att_completed_${busId}`, JSON.stringify(completedStops)); }
    showToast('Stop marked complete.', 'success'); renderStops();
  };
  function showToast(m, t='info') { const c = document.getElementById('toast-container'); const d = document.createElement('div'); d.className = `toast ${t} active`; d.textContent = m; c.appendChild(d); setTimeout(()=>d.remove(),3000); }
</script>
</body>
</html>
